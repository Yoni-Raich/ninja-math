<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>אפקטים – חיתוך, פגיעה, חסימה, עשן</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 240px; height: 240px; position: relative;">
<svg width="240" height="240" viewBox="0 0 240 240" style="display: block; overflow: visible;">
<sc-if value="{{isSlash}}" hint-placeholder-val="{{ true }}">
<g>
<path d="M14 204 Q 64 40 228 20 Q 108 70 14 204 Z" fill="{{color}}" opacity="0.35" stroke="{{color}}" stroke-width="14" stroke-linejoin="round"></path>
<path d="M14 204 Q 64 40 228 20 Q 108 70 14 204 Z" fill="#FFFFFF"></path>
<path d="M30 180 Q 80 70 200 34" stroke="{{color}}" stroke-width="3" fill="none" opacity="0.8"></path>
<path d="M40 214 Q 100 120 236 60 M4 170 Q 40 80 150 24" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round"></path>
<g fill="#FFFFFF"><circle cx="186" cy="48" r="3"></circle><circle cx="212" cy="64" r="2"></circle><circle cx="60" cy="150" r="2.5"></circle><circle cx="30" cy="118" r="2"></circle></g>
</g>
</sc-if>
<sc-if value="{{isImpact}}" hint-placeholder-val="{{ false }}">
<g>
<path d="M120 6 L136 78 L204 36 L160 96 L234 112 L162 130 L210 196 L140 150 L128 234 L108 152 L40 206 L82 132 L6 122 L80 100 L30 40 L100 76 Z" fill="{{color}}" stroke="#0B0B14" stroke-width="4" stroke-linejoin="round"></path>
<path d="M120 44 L130 94 L176 70 L144 108 L194 118 L144 128 L170 170 L130 140 L122 192 L110 142 L70 172 L96 128 L48 118 L98 104 L66 66 L108 92 Z" fill="#FFF3B0"></path>
<circle cx="120" cy="118" r="22" fill="#FFFFFF"></circle>
<g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"><path d="M120 0 V-18 M240 118 H258 M0 118 H-18 M120 236 V254 M206 30 L220 16 M34 206 L20 220"></path></g>
</g>
</sc-if>
<sc-if value="{{isBlock}}" hint-placeholder-val="{{ false }}">
<g>
<circle cx="120" cy="120" r="70" fill="none" stroke="{{color}}" stroke-width="6" opacity="0.5"></circle>
<path d="M120 50 A70 70 0 0 1 190 120" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round"></path>
<path d="M120 190 A70 70 0 0 1 50 120" stroke="{{color}}" stroke-width="8" fill="none" stroke-linecap="round"></path>
<path d="M120 84 L128 112 L156 120 L128 128 L120 156 L112 128 L84 120 L112 112 Z" fill="#FFFFFF" stroke="{{color}}" stroke-width="3" stroke-linejoin="round"></path>
<g stroke="{{color}}" stroke-width="4" stroke-linecap="round"><path d="M172 64 L196 44 M180 170 L204 190 M60 170 L40 194 M64 66 L44 44"></path></g>
</g>
</sc-if>
<sc-if value="{{isSmoke}}" hint-placeholder-val="{{ false }}">
<g fill="{{color}}" stroke="#0B0B14" stroke-width="3">
<circle cx="80" cy="150" r="42"></circle><circle cx="140" cy="130" r="50"></circle><circle cx="180" cy="170" r="36"></circle><circle cx="110" cy="182" r="38"></circle><circle cx="60" cy="100" r="26"></circle><circle cx="170" cy="80" r="24"></circle>
<circle cx="126" cy="116" r="18" fill="#FFFFFF" stroke="none" opacity="0.4"></circle>
</g>
</sc-if>
<sc-if value="{{isSpecial}}" hint-placeholder-val="{{ false }}">
<g>
<path d="M10 220 L230 20" stroke="{{color}}" stroke-width="30" stroke-linecap="round" opacity="0.4"></path>
<path d="M10 20 L230 220" stroke="{{color}}" stroke-width="30" stroke-linecap="round" opacity="0.4"></path>
<path d="M10 220 L230 20" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"></path>
<path d="M10 20 L230 220" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"></path>
<circle cx="120" cy="120" r="26" fill="#FFFFFF"></circle>
<circle cx="120" cy="120" r="44" fill="none" stroke="{{color}}" stroke-width="6"></circle>
</g>
</sc-if>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["slash","impact","block","smoke","special"],"default":"slash"},"color":{"editor":"color","default":"#22D3EE","options":["#22D3EE","#E63946","#F5B82E","#9775FA"]},"$preview":{"width":240,"height":240}}'>
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind ?? 'slash';
    const def = { slash: '#22D3EE', impact: '#F5B82E', block: '#22D3EE', smoke: '#6C6887', special: '#E63946' };
    return {
      isSlash: k === 'slash', isImpact: k === 'impact', isBlock: k === 'block', isSmoke: k === 'smoke', isSpecial: k === 'special',
      color: this.props.color || def[k] || '#22D3EE'
    };
  }
}
</script>
</body>
</html>
